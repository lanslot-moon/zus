  <text x="930" y="260" text-anchor="middle" class="s">复杂协作最强</text>
  <line x1="140" y1="185" x2="140" y2="235" stroke="#666"/><line x1="400" y1="185" x2="400" y2="235" stroke="#666"/><line x1="660" y1="185" x2="660" y2="235" stroke="#666"/><line x1="930" y1="185" x2="930" y2="235" stroke="#666"/>
