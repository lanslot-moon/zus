<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400">
  <style>.h{font:700 18px sans-serif;fill:#222}.t{font:600 16px sans-serif;fill:#222}.s{font:14px sans-serif;fill:#333}.box{rx:12;ry:12;stroke-width:2}</style>
  <rect width="1080" height="400" fill="#fff"/>
  <text x="540" y="40" text-anchor="middle" class="h">四种权限模型关注点对比</text>
  <rect x="40" y="90" width="200" height="90" class="box" fill="#dae8fc" stroke="#6c8ebf"/><text x="140" y="122" text-anchor="middle" class="t">ACL</text><text x="140" y="146" text-anchor="middle" class="s">结果直接、审计友好</text>
  <rect x="300" y="90" width="200" height="90" class="box" fill="#d5e8d4" stroke="#82b366"/><text x="400" y="122" text-anchor="middle" class="t">RBAC</text><text x="400" y="146" text-anchor="middle" class="s">角色复用、岗位映射</text>
  <rect x="560" y="90" width="200" height="90" class="box" fill="#fff2cc" stroke="#d6b656"/><text x="660" y="122" text-anchor="middle" class="t">ABAC</text><text x="660" y="146" text-anchor="middle" class="s">上下文动态、策略灵活</text>
  <rect x="820" y="90" width="220" height="90" class="box" fill="#f8cecc" stroke="#b85450"/><text x="930" y="122" text-anchor="middle" class="t">ReBAC</text><text x="930" y="146" text-anchor="middle" class="s">关系传播、统一底座</text>
