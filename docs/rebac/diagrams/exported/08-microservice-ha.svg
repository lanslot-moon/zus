<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="520" viewBox="0 0 1220 520">
  <style>
    .t{font:600 16px "Virgil","Comic Sans MS",sans-serif;fill:#222}
    .s{font:14px "Virgil","Comic Sans MS",sans-serif;fill:#333}
    .box{fill:#fffdf8;stroke:#444;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .line{fill:none;stroke:#444;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="1220" height="520" fill="#fffdf8"/>
  <text x="610" y="38" text-anchor="middle" class="t">ReBAC 基础设施的高可用部署关系</text>

  <rect x="54" y="64" width="190" height="86" rx="14" ry="14" fill="#dff1ff" class="box"/><text x="149" y="102" text-anchor="middle" class="t">Control Plane</text><text x="149" y="126" text-anchor="middle" class="s">model / schema / publish</text>
  <rect x="304" y="154" width="310" height="118" rx="16" ry="16" fill="#ffe3dd" class="box"/><text x="459" y="196" text-anchor="middle" class="t">Authorization Service Cluster</text><text x="459" y="222" text-anchor="middle" class="s">check / listObjects / listUsers</text>
  <ellipse cx="860" cy="136" rx="106" ry="62" fill="#fff3cf" class="box"/><text x="860" y="132" text-anchor="middle" class="t">Primary Store</text><text x="860" y="156" text-anchor="middle" class="s">write + strong read</text>
  <ellipse cx="860" cy="304" rx="106" ry="62" fill="#fff3cf" class="box"/><text x="860" y="300" text-anchor="middle" class="t">Read Replica</text><text x="860" y="324" text-anchor="middle" class="s">search / low-latency read</text>
  <rect x="244" y="350" width="160" height="82" rx="14" ry="14" fill="#e7f7de" class="box"/><text x="324" y="392" text-anchor="middle" class="t">Cache</text><text x="324" y="416" text-anchor="middle" class="s">model / tuple result</text>
  <rect x="464" y="350" width="214" height="82" rx="14" ry="14" fill="#efe5ff" class="box"/><text x="571" y="392" text-anchor="middle" class="t">Watch / Changelog</text><text x="571" y="416" text-anchor="middle" class="s">invalidate / replay / sync</text>

  <path d="M244 106 C274 106, 286 120, 304 168" class="line"/><polygon points="304,168 292,162 292,174" fill="#444"/>
  <path d="M614 188 H754" class="line"/><polygon points="754,188 742,182 742,194" fill="#444"/>
  <path d="M614 236 C674 236, 700 304, 754 304" class="line"/><polygon points="754,304 742,298 742,310" fill="#444"/>
  <path d="M459 272 V350" class="line"/><polygon points="459,350 453,338 465,338" fill="#444"/>
  <path d="M528 272 V350" class="line"/><polygon points="528,350 522,338 534,338" fill="#444"/>

  <text x="266" y="96" class="s">publish model</text>
  <text x="652" y="178" class="s">write / strong read</text>
  <text x="654" y="252" class="s">replica / search candidates</text>
  <text x="472" y="336" class="s">reuse hot state</text>
  <text x="544" y="336" class="s">event-driven sync</text>
</svg>
