<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430">
  <style>
    .t{font:600 16px "Virgil","Comic Sans MS",sans-serif;fill:#222}
    .s{font:14px "Virgil","Comic Sans MS",sans-serif;fill:#333}
    .box{fill:#fffdf8;stroke:#444;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .line{fill:none;stroke:#444;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="1180" height="430" fill="#fffdf8"/>
  <text x="590" y="38" text-anchor="middle" class="t">Tuple 与 Userset 的事实层结构</text>
  <circle cx="100" cy="215" r="44" fill="#dff1ff" class="box"/><text x="100" y="210" text-anchor="middle" class="t">subject</text><text x="100" y="232" text-anchor="middle" class="s">user / group</text>
  <rect x="220" y="160" width="210" height="110" rx="14" ry="14" fill="#e7f7de" class="box"/><text x="325" y="198" text-anchor="middle" class="t">tuple fact</text><text x="325" y="224" text-anchor="middle" class="s">subject + relation + object</text>
  <rect x="500" y="74" width="180" height="70" rx="14" ry="14" fill="#fff3cf" class="box"/><text x="590" y="116" text-anchor="middle" class="t">relation</text>
  <rect x="500" y="180" width="180" height="70" rx="14" ry="14" fill="#ffe3dd" class="box"/><text x="590" y="222" text-anchor="middle" class="t">object</text>
  <rect x="500" y="286" width="180" height="70" rx="14" ry="14" fill="#efe5ff" class="box"/><text x="590" y="318" text-anchor="middle" class="t">subject_relation</text><text x="590" y="340" text-anchor="middle" class="s">userset / wildcard</text>
  <rect x="760" y="160" width="320" height="110" rx="14" ry="14" fill="#ffe9cf" class="box"/><text x="920" y="198" text-anchor="middle" class="t">增强字段</text><text x="920" y="224" text-anchor="middle" class="s">condition / expires / revision / audit</text>

  <path d="M144 215 H220" class="line"/><polygon points="220,215 208,209 208,221" fill="#444"/>
  <path d="M430 182 H500" class="line"/><polygon points="500,182 488,176 488,188" fill="#444"/>
  <path d="M430 215 H500" class="line"/><polygon points="500,215 488,209 488,221" fill="#444"/>
  <path d="M430 248 H500" class="line"/><polygon points="500,248 488,242 488,254" fill="#444"/>
  <path d="M430 215 H760" class="line"/><polygon points="760,215 748,209 748,221" fill="#444"/>

  <text x="454" y="170" class="s">命中的关系名</text>
  <text x="452" y="206" class="s">被访问对象</text>
  <text x="436" y="280" class="s">是否是 userset / wildcard</text>
  <text x="618" y="202" class="s"></text>
</svg>
