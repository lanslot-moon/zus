<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390">
  <style>
    .t{font:600 16px "Virgil","Comic Sans MS",sans-serif;fill:#222}
    .s{font:14px "Virgil","Comic Sans MS",sans-serif;fill:#333}
    .box{fill:#fffdf8;stroke:#444;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .line{fill:none;stroke:#444;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="1200" height="390" fill="#fffdf8"/>
  <text x="600" y="38" text-anchor="middle" class="t">写后读一致性中的 token / zookie 语义</text>
  <circle cx="96" cy="194" r="44" fill="#dff1ff" class="box"/><text x="96" y="190" text-anchor="middle" class="t">Client</text>
  <rect x="230" y="74" width="180" height="78" rx="14" ry="14" fill="#e7f7de" class="box"/><text x="320" y="120" text-anchor="middle" class="t">Write API</text>
  <rect x="230" y="236" width="180" height="78" rx="14" ry="14" fill="#fff3cf" class="box"/><text x="320" y="282" text-anchor="middle" class="t">Read API</text>
  <rect x="520" y="154" width="220" height="78" rx="14" ry="14" fill="#ffe3dd" class="box"/><text x="630" y="200" text-anchor="middle" class="t">Store / Revision</text>
  <rect x="860" y="154" width="220" height="78" rx="14" ry="14" fill="#efe5ff" class="box"/><text x="970" y="186" text-anchor="middle" class="t">Token / Zookie</text><text x="970" y="208" text-anchor="middle" class="s">at least as fresh</text>

  <path d="M140 174 C176 160, 194 142, 230 113" class="line"/><polygon points="230,113 218,107 218,119" fill="#444"/>
  <path d="M140 214 C176 228, 194 246, 230 275" class="line"/><polygon points="230,275 218,269 218,281" fill="#444"/>
  <path d="M410 113 C456 113, 476 170, 520 193" class="line"/><polygon points="520,193 508,187 508,199" fill="#444"/>
  <path d="M740 193 H860" class="line"/><polygon points="860,193 848,187 848,199" fill="#444"/>
  <path d="M410 275 C454 275, 476 238, 520 210" class="line"/><polygon points="520,210 508,204 508,216" fill="#444"/>

  <text x="168" y="146" class="s">write tuple</text>
  <text x="152" y="254" class="s">read with token</text>
  <text x="446" y="102" class="s">commit revision</text>
  <text x="786" y="181" class="s">issue token</text>
  <text x="420" y="266" class="s">read against revision not older than token</text>
</svg>
