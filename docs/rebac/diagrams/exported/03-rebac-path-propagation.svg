<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="340" viewBox="0 0 1180 340">
  <style>
    .t{font:600 16px "Virgil","Comic Sans MS",sans-serif;fill:#222}
    .s{font:14px "Virgil","Comic Sans MS",sans-serif;fill:#333}
    .box{fill:#fffdf8;stroke:#444;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .line{fill:none;stroke:#444;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="1180" height="340" fill="#fffdf8"/>
  <text x="590" y="38" text-anchor="middle" class="t">ReBAC 授权路径传播示意</text>

  <circle cx="90" cy="172" r="42" fill="#dff1ff" class="box"/><text x="90" y="168" text-anchor="middle" class="t">user</text><text x="90" y="190" text-anchor="middle" class="s">alice</text>
  <rect x="190" y="122" width="190" height="100" rx="14" ry="14" fill="#e7f7de" class="box"/><text x="285" y="156" text-anchor="middle" class="t">group:eng#member</text><text x="285" y="184" text-anchor="middle" class="s">用户集合 userset</text>
  <rect x="450" y="122" width="200" height="100" rx="14" ry="14" fill="#fff3cf" class="box"/><text x="550" y="156" text-anchor="middle" class="t">folder:design#viewer</text><text x="550" y="184" text-anchor="middle" class="s">上层对象上的可见集合</text>
  <rect x="720" y="122" width="200" height="100" rx="14" ry="14" fill="#ffe3dd" class="box"/><text x="820" y="156" text-anchor="middle" class="t">document:roadmap</text><text x="820" y="184" text-anchor="middle" class="s">目标对象</text>
  <rect x="990" y="122" width="120" height="100" rx="14" ry="14" fill="#efe5ff" class="box"/><text x="1050" y="156" text-anchor="middle" class="t">viewer</text><text x="1050" y="184" text-anchor="middle" class="s">成立</text>

  <path d="M132 172 H190" class="line"/><polygon points="190,172 178,166 178,178" fill="#444"/>
  <path d="M380 172 H450" class="line"/><polygon points="450,172 438,166 438,178" fill="#444"/>
  <path d="M650 172 H720" class="line"/><polygon points="720,172 708,166 708,178" fill="#444"/>
  <path d="M920 172 H990" class="line"/><polygon points="990,172 978,166 978,178" fill="#444"/>

  <text x="160" y="158" class="s">member</text>
  <text x="412" y="158" class="s">viewer</text>
  <text x="682" y="158" class="s">parent_folder</text>
  <text x="946" y="158" class="s">derived permission</text>

  <path d="M550 222 C550 258, 820 258, 820 222" class="line"/>
  <polygon points="820,222 808,216 808,228" fill="#444"/>
  <text x="684" y="286" class="s">TTU：通过 parent_folder 找到上层对象，再继续判断 viewer</text>
</svg>
