# ==========================================================================
# zus-starter 测试环境配置（端到端真实链路）
#
# 目标：在没有 MySQL / Redis 的环境下启动完整 Spring 上下文，
#   controller → application service → domain → infrastructure → H2 全链路真实执行，
#   测试通过真实数据准备、真实接口调用、真实 DB 查询完成断言。
#
# 策略：
#   - DataSource：H2（MySQL 兼容模式，测试资源下的 schema.sql 自动初始化）
#   - Redis：不启用，fga.cache.type=local 走本地缓存；Zookie/Check 缓存均为内存实现
# ==========================================================================

server.port=0

# H2 内存库（MySQL 兼容模式，DB_CLOSE_DELAY=-1 保证 JVM 运行期间不关闭）
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:zus_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# 自动执行测试 classpath 下的 schema.sql 建表
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# 等建表完成后再进行 MyBatis 初始化
spring.jpa.defer-datasource-initialization=false

# 本地缓存，避免走 Redis
fga.cache.type=local

# 避免 MyBatis-Plus banner 污染测试日志
mybatis-plus.global-config.banner=false

# 静默部分启动日志
logging.level.org.springframework=WARN
logging.level.org.mybatis=WARN
logging.level.com.baomidou=WARN
logging.level.org.kitona.zus=INFO
